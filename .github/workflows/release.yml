name: release

on:
  push:
    tags: ["v*"]

# 显式授予 contents:write，否则默认 GITHUB_TOKEN 无法创建 Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: bash
        run: |
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag ($TAG) 与 src-tauri/tauri.conf.json 的版本 (v$VERSION) 不一致。请将 version 改为 ${TAG#v}，或改用 v$VERSION 作为 tag。"
            exit 1
          fi
          echo "版本校验通过：$TAG == v$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 单元测试（出包前门禁）
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (tauri CLI)
        env:
          # 更新包签名密钥（minisign）；缺失时 tauri build 直接失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 生成 updater 清单（latest.json）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          test -f "$ART" || { echo "::error::未找到安装包 $ART"; exit 1; }
          test -f "$ART.sig" || { echo "::error::未找到签名文件 $ART.sig，请检查 TAURI_SIGNING_PRIVATE_KEY 是否已配置"; exit 1; }
          # updater 端点清单：version 必须是不带 v 前缀的 semver，signature 为安装包 minisign 签名。
          # 签名必须用 $(cat) 而非 --rawfile：bash 会剥掉文件尾部换行，updater 的 base64 解码不容忍换行符
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zap_${VERSION}_x64-setup.exe" \
            --arg signature "$(cat "$ART.sig")" \
            '{version: $version, notes: ("zap " + $version), pub_date: $pub_date, platforms: { "windows-x86_64": { signature: $signature, url: $url } } }' \
            > latest.json
          echo "latest.json 已生成："
          cat latest.json

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          # 自动发布：tag 推送即公开（主流做法）。
          # 若该 tag 的 Release 已存在（重跑场景），直接失败示警，绝不覆盖已发布的版本。
          gh release create "$TAG" \
            --title "zap $TAG" \
            --notes-file .github/release-notes.md \
            "$ART" "$ART.sig" latest.json
