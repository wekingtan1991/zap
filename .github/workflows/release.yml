name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动补发通道（评审 P2-06）：同 tag 重跑须先删 Release

# 显式授予 contents:write，否则默认 GITHUB_TOKEN 无法创建 Release；
# actions:read 供下方发版闸读取同仓 ci workflow run 的结论
permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      # 发版闸（2026-11-06）：tag 可从任意机器对任意 commit 打出、不经 CI
      # （见下方出包门禁注释）。只查 master HEAD 会被「tag 打在旧的/红的
      # commit」绕过，因此按 GITHUB_SHA（tag 所指 commit）查它自己的 ci run；
      # 非 success 一律拒发，含被取消 / 仍在跑 / 从未跑过。放在 Checkout
      # 之前，fail fast，且不依赖仓库内容。（2026-11-05 v0.17.0 的 ci 红
      # 却发版成功，就是这道闸缺位。）
      - name: 发版闸：本 commit 的 ci 必须 success
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          CI="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "ci")] | sort_by(.created_at) | last | .conclusion // "none"')"
          echo "commit ${SHA}（${GITHUB_REF}）的 ci 结论：${CI}"
          if [ "${CI}" != "success" ]; then
            echo "::error::发版闸拦截：ci 结论为 ${CI}，要求 success。tag 打在未跑完或未跑过 ci 的 commit 上一律拒发；被取消、仍在跑、从未跑过都算不过。等 ci 重跑 success 后再打 tag。"
            echo "查看：https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
            exit 1
          fi
          echo "发版闸通过：ci=success"

      - name: Checkout
        # v7.0.1（评审 P2-05：action 固定 commit SHA）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: bash
        run: |
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag ($TAG) 与 src-tauri/tauri.conf.json 的版本 (v$VERSION) 不一致。请将 version 改为 ${TAG#v}，或改用 v$VERSION 作为 tag。"
            exit 1
          fi
          echo "版本校验通过：$TAG == v$VERSION"

      - name: Install pnpm
        # v6.1.0（annotated tag 须解析成 commit SHA：tag 对象 SHA 无法被 Actions 解析）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        # stable 分支头；具体版本钉在 src-tauri/rust-toolchain.toml（评审 P2-06）
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        # v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 出包前门禁与 ci.yml 同面（2026-11-04 评审 R16：tag 可从任意机器对任意
      # commit 打出，不经 CI——fmt/clippy/vitest/tsc/check:kb/版本一致性全部
      # 在此重跑，从别的机器直推 tag 也逃不过）
      - name: 格式检查（rustfmt）
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint（clippy 零警告）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试（出包前门禁）
        working-directory: src-tauri
        run: cargo test --lib

      - name: 前端单元测试
        run: pnpm test

      - name: 键盘面纪律自检
        run: pnpm check:kb

      - name: 版本一致性校验
        run: node scripts/verify-version.mjs

      - name: 敏感信息扫描
        run: pnpm check:secrets

      - name: 前端类型检查与构建
        run: pnpm build

      - name: Build (tauri CLI)
        env:
          # 更新包签名密钥（minisign）；缺失时 tauri build 直接失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 生成 updater 清单（latest.json）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          test -f "$ART" || { echo "::error::未找到安装包 $ART"; exit 1; }
          test -f "$ART.sig" || { echo "::error::未找到签名文件 $ART.sig，请检查 TAURI_SIGNING_PRIVATE_KEY 是否已配置"; exit 1; }
          # updater 端点清单：version 必须是不带 v 前缀的 semver，signature 为安装包 minisign 签名。
          # 签名必须用 $(cat) 而非 --rawfile：bash 会剥掉文件尾部换行，updater 的 base64 解码不容忍换行符
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zap_${VERSION}_x64-setup.exe" \
            --arg signature "$(cat "$ART.sig")" \
            '{version: $version, notes: ("zap " + $version), pub_date: $pub_date, platforms: { "windows-x86_64": { signature: $signature, url: $url } } }' \
            > latest.json
          echo "latest.json 已生成："
          cat latest.json

      # 未签名安装包的分发信任第一块拼图（评审 P0-2①）：把 SHA256 随 Release
      # 发布并写进 notes 尾部，用户可自行核对下载完整性；SmartScreen 提示时
      # 也多一个「哈希对得上」的判断依据
      - name: 生成安装包 SHA256
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          SHA256="$(sha256sum "$ART" | awk '{print $1}')"
          printf '%s\n' "$SHA256" > setup.sha256
          {
            echo ""
            echo "## SHA256"
            echo ""
            echo '```'
            echo "$SHA256  zap_${VERSION}_x64-setup.exe"
            echo '```'
          } >> .github/release-notes.md
          echo "setup.sha256: $SHA256"

      # 产物留档（评审 P2-06）：Release 创建失败时产物仍在 workflow artifacts，
      # 不必为排查重跑整个 20 分钟构建
      - name: 留档产物
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/nsis/zap_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/zap_*_x64-setup.exe.sig
            latest.json
            setup.sha256
          if-no-files-found: error

      # 两步拆分（评审 P2-06）：create 与 upload 分离——上传中途失败重跑
      # `gh release upload --clobber` 即可补齐，不会留下「半发版」（缺
      # latest.json 时全体用户更新静默失败）。create 幂等：已存在跳过
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Release $TAG 已存在（补传场景），跳过创建"
          } || {
            gh release create "$TAG" --title "zap $TAG" --notes-file .github/release-notes.md
          }

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          # --clobber：补传场景覆盖同名资产，绝不静默失败
          gh release upload "$TAG" --clobber "$ART" "$ART.sig" latest.json setup.sha256
