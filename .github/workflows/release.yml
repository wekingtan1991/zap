name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手动补发通道（评审 P2-06）：同 tag 重跑须先删 Release

# 显式授予 contents:write，否则默认 GITHUB_TOKEN 无法创建 Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # v4.2.2（评审 P2-05：action 固定 commit SHA）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: bash
        run: |
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag ($TAG) 与 src-tauri/tauri.conf.json 的版本 (v$VERSION) 不一致。请将 version 改为 ${TAG#v}，或改用 v$VERSION 作为 tag。"
            exit 1
          fi
          echo "版本校验通过：$TAG == v$VERSION"

      - name: Install pnpm
        # v4.0.0（annotated tag 须解析成 commit SHA：tag 对象 SHA 无法被 Actions 解析）
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        # stable 分支头；具体版本钉在 src-tauri/rust-toolchain.toml（评审 P2-06）
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        # v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 单元测试（出包前门禁）
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (tauri CLI)
        env:
          # 更新包签名密钥（minisign）；缺失时 tauri build 直接失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: 生成 updater 清单（latest.json）
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          test -f "$ART" || { echo "::error::未找到安装包 $ART"; exit 1; }
          test -f "$ART.sig" || { echo "::error::未找到签名文件 $ART.sig，请检查 TAURI_SIGNING_PRIVATE_KEY 是否已配置"; exit 1; }
          # updater 端点清单：version 必须是不带 v 前缀的 semver，signature 为安装包 minisign 签名。
          # 签名必须用 $(cat) 而非 --rawfile：bash 会剥掉文件尾部换行，updater 的 base64 解码不容忍换行符
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zap_${VERSION}_x64-setup.exe" \
            --arg signature "$(cat "$ART.sig")" \
            '{version: $version, notes: ("zap " + $version), pub_date: $pub_date, platforms: { "windows-x86_64": { signature: $signature, url: $url } } }' \
            > latest.json
          echo "latest.json 已生成："
          cat latest.json

      # 未签名安装包的分发信任第一块拼图（评审 P0-2①）：把 SHA256 随 Release
      # 发布并写进 notes 尾部，用户可自行核对下载完整性；SmartScreen 提示时
      # 也多一个「哈希对得上」的判断依据
      - name: 生成安装包 SHA256
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          SHA256="$(sha256sum "$ART" | awk '{print $1}')"
          printf '%s\n' "$SHA256" > setup.sha256
          {
            echo ""
            echo "## SHA256"
            echo ""
            echo '```'
            echo "$SHA256  zap_${VERSION}_x64-setup.exe"
            echo '```'
          } >> .github/release-notes.md
          echo "setup.sha256: $SHA256"

      # 产物留档（评审 P2-06）：Release 创建失败时产物仍在 workflow artifacts，
      # 不必为排查重跑整个 20 分钟构建
      - name: 留档产物
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/nsis/zap_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/zap_*_x64-setup.exe.sig
            latest.json
            setup.sha256
          if-no-files-found: error

      # 两步拆分（评审 P2-06）：create 与 upload 分离——上传中途失败重跑
      # `gh release upload --clobber` 即可补齐，不会留下「半发版」（缺
      # latest.json 时全体用户更新静默失败）。create 幂等：已存在跳过
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Release $TAG 已存在（补传场景），跳过创建"
          } || {
            gh release create "$TAG" --title "zap $TAG" --notes-file .github/release-notes.md
          }

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ART="src-tauri/target/release/bundle/nsis/zap_${VERSION}_x64-setup.exe"
          # --clobber：补传场景覆盖同名资产，绝不静默失败
          gh release upload "$TAG" --clobber "$ART" "$ART.sig" latest.json setup.sha256
