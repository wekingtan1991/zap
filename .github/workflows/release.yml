name: release

on:
  push:
    tags: ["v*"]

# 显式授予 contents:write，否则默认 GITHUB_TOKEN 无法创建 Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 单元测试（出包前门禁）
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (tauri CLI)
        run: pnpm tauri build

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 幂等：若已存在同 tag 的【草稿】Release 先删掉（不删 tag，不动已发布的）
          if gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$TAG" -y
          fi
          gh release create "$TAG" \
            --draft \
            --title "zap $TAG" \
            --notes-file .github/release-notes.md \
            src-tauri/target/release/bundle/nsis/zap_*_x64-setup.exe
