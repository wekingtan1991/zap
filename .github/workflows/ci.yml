name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # v7.0.1（评审 P2-05：action 固定 commit SHA，防 tag 被劫持；升级由 dependabot 提 PR）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 不写死版本：读取 package.json 的 packageManager 字段
      - name: Install pnpm
        # v4.0.0（annotated tag 须解析成 commit SHA：tag 对象 SHA 无法被 Actions 解析）
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        # stable 分支头（dtolnay/rust-toolchain 按分支分发，SHA 随 stable 更新；版本钉在 rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        # v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 前端单元测试
        run: pnpm test

      # 键盘面纪律自检：模式化键盘面一律 window 捕获，新增容器级 onKeyDown 直接红灯
      - name: 键盘面纪律自检
        run: pnpm check:kb

      # 四处版本一致性（发版 bump 漏改即红灯）
      - name: 版本一致性校验
        run: node scripts/verify-version.mjs

      - name: 前端类型检查与构建
        run: pnpm build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 格式检查（rustfmt）
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint（clippy 零警告）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # 供应链审计（评审 P2-05）：已知漏洞即红但不断流（continue-on-error 观察）
      - name: 前端依赖审计
        continue-on-error: true
        run: pnpm audit --prod
