name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 不写死版本：读取 package.json 的 packageManager 字段
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查与构建
        run: pnpm build

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 格式检查（rustfmt）
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint（clippy 零警告）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
