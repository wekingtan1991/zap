name: 功能建议
description: 提一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。zap 的取舍标准是：呼出即用、毫秒级响应、数据不出本机。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景/痛点，而不是解决方案本身
      placeholder: 我经常需要 …，但现在必须 …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的交互
      description: 如果能描述出"按什么键、看到什么、发生什么"最理想
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
