version: 2
updates:
  # 前端依赖：每周一批 grouped PR（评审 P2-05）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Rust 依赖：每周一批
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions：含 commit SHA 固定的引用，dependabot 会提升级 PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
