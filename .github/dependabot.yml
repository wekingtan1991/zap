version: 2
updates:
  # 前端依赖（含 Tauri 插件与 Radix 组件）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]

  # Rust 依赖
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
