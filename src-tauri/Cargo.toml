[package]
name = "zap"
version = "0.11.0"
description = "Zap - 闪电般的个人效率统一入口：启动器 / 剪贴板历史 / 账号库"
authors = ["wekingtan <21351378+wekingtan1991@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wekingtan1991/zap"
homepage = "https://github.com/wekingtan1991/zap"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clipboard-master = "4.0.0"
arboard = "3.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "default-tls"] }
base64 = "0.23.1"
pinyin = "0.11.0"
serde_yaml_ng = "0.10"
# 账号库备份加密：PBKDF2-SHA256 派生密钥 + AES-256-GCM（备份口令用户自定）
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.3"
# 账号库 TOTP：RFC 6238（HMAC-SHA1/30s/6 位）+ Base32 密钥
hmac = "0.12"
sha1 = "0.10"
base32 = "0.5"
# 文本工具域：MD5 哈希（SHA1/SHA256 复用上方）+ 时间戳换算（本地时区）
md-5 = "0.10"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Environment"] }
# #[implement] 宏展开直接引用 windows_core 路径，须为直接依赖
windows-core = "0.62"
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 磁盘瘦身：行号级调试信息足够日常排错；依赖不生成调试信息（MSVC 下 PDB 是体积大头）
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

