[package]
name = "zap"
version = "0.19.0"
description = "Zap - 闪电般的个人效率统一入口：启动器 / 剪贴板历史 / 账号库"
authors = ["wekingtan <21351378+wekingtan1991@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wekingtan1991/zap"
homepage = "https://github.com/wekingtan1991/zap"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# benches（scripts/bench 持续方案 2026-11-07）：确定性纯层基准。
# default-features=false 关掉 rayon/plotters/html——只要数字不要图表，编译面最小
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "layers"
harness = false

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
clipboard-master = "4.0.0"
arboard = "3.6.1"
# Everything 官网便携版下载用（everything.rs blocking 客户端）。
# 注（2026-11-04 评审 R15 实证）：default-tls 特性名有误导——cargo tree 里
# 无 native-tls/schannel，实际解析走 rustls（rustls-platform-verifier +
# ring/aws-lc 双密码后端，aws-lc-sys 经 cmake 构建）
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "default-tls"] }
base64 = "0.23.1"
pinyin = "0.11.0"
serde_yaml_ng = "0.10"
# 账号库备份加密：PBKDF2-SHA256 派生密钥 + AES-256-GCM（备份口令用户自定）
# 加密栈五件（pbkdf2/sha2/hmac/sha1/md-5）必须整族同版升级：digest 0.10 与 0.11
# 两个生态系的 trait 不互通（dependabot 按单包拆 PR 看不见这条耦合线，单独合会红）
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
aes-gcm = "0.10"
getrandom = "0.3"
# 账号库 TOTP：RFC 6238（HMAC-SHA1/30s/6 位）+ Base32 密钥
hmac = "0.13"
sha1 = "0.11"
base32 = "0.5"
# 文本工具域：MD5 哈希（SHA1/SHA256 复用上方）+ 时间戳换算（本地时区）
md-5 = "0.11"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
# Win32_System_Com_StructuredStorage：IDataObject_Vtbl::new / STGMEDIUM 被该 feature
# 门控（windows-0.62.2 Com/mod.rs），文本拖出自有 IDataObject 的 #[implement] 需要它
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
# #[implement] 宏展开直接引用 windows_core 路径，须为直接依赖
windows-core = "0.62"
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 磁盘瘦身：行号级调试信息足够日常排错；依赖不生成调试信息（MSVC 下 PDB 是体积大头）
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# 基准 profile（scripts/bench 方案 2026-11-07）：优化级别对齐 release，lto 收
# thin + 并行 codegen 换快编译——benches 要常态复跑，数字只与本机基线比；
# 发布级全链路性能走 CDP 实测 release 构建（lto=true），不在这里。
# panic 策略不必写：cargo 对 test/bench profile 强制 unwind
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

